spring:
  application:
    name: reminder-app

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reminder}
    username: ${DB_USERNAME:reminder}
    password: ${DB_PASSWORD:reminder}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${MAIL_SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${MAIL_STARTTLS_ENABLE:true}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

app:
  notification:
    batch-size: ${NOTIFICATION_BATCH_SIZE:100}
    poll-delay-ms: ${NOTIFICATION_POLL_DELAY_MS:30000}
    initial-delay-ms: ${NOTIFICATION_INITIAL_DELAY_MS:5000}
    email:
      from: ${MAIL_FROM:}
    telegram:
      api-url: ${TELEGRAM_API_URL:https://api.telegram.org}
      bot-token: ${TELEGRAM_BOT_TOKEN:}
      max-message-length: ${MAX-MESSAGE-LENGTH:4096}