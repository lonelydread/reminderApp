databaseChangeLog:
  - changeSet:
      id: 001-create-app-user
      author: codex
      changes:
        - createTable:
            tableName: app_user
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: oauth_subject
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: email
                  type: VARCHAR(320)
              - column:
                  name: telegram_chat_id
                  type: BIGINT

  - changeSet:
      id: 002-create-reminder
      author: codex
      changes:
        - createTable:
            tableName: reminder
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(4096)
              - column:
                  name: remind
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: email_notification_processed_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: telegram_notification_processed_at
                  type: TIMESTAMP WITH TIME ZONE

        - addForeignKeyConstraint:
            baseTableName: reminder
            baseColumnNames: user_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_reminder_user
            onDelete: CASCADE

        - createIndex:
            tableName: reminder
            indexName: idx_reminder_user_remind
            columns:
              - column:
                  name: user_id
              - column:
                  name: remind

        - createIndex:
            tableName: reminder
            indexName: idx_reminder_due_notifications
            columns:
              - column:
                  name: remind
              - column:
                  name: email_notification_processed_at
              - column:
                  name: telegram_notification_processed_at